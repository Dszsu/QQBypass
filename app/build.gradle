plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.xalsace.qqbypass'
    compileSdk 37

    // 签名配置从 keystore.properties 读取（该文件已 gitignore，密钥不进版本库）。
    // 复制 keystore.properties.example 为 keystore.properties 并填入自己的密钥即可。
    signingConfigs {
        release {
            def ksPropsFile = rootProject.file("keystore.properties")
            if (ksPropsFile.exists()) {
                def ksProps = new Properties()
                ksPropsFile.withInputStream { ksProps.load(it) }
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            } else {
                def localDebugKs = file("${System.env.HOME}/Work/android-sdk/debug.keystore")
                if (localDebugKs.exists()) {
                    storeFile localDebugKs
                    storePassword "android"
                    keyAlias "androiddebugkey"
                    keyPassword "android"
                }
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        applicationId "io.github.xalsace.qqbypass"
        minSdk 26
        targetSdk 37
        versionCode 93
        versionName "1.0.93"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    ndkVersion "30.0.16248370"

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    // 启用 prefab，让 CMake 能通过 find_package 找到 ByteHook 的预编译库
    buildFeatures {
        prefab true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    // 使用官方 Xposed API 仓库
    compileOnly 'de.robv.android.xposed:api:82:sources'
    compileOnly 'de.robv.android.xposed:api:82'

    // ByteHook - 字节跳动 PLT hook 框架（预编译 AAR，含 prefab 供 CMake 使用）
    implementation 'com.bytedance:bytehook:1.1.2'

    // DexKit - 高性能 dex 字节码搜索库，用于动态定位混淆后的检测点
    implementation 'org.luckypray:dexkit:2.3.0'

    // Kotlin 标准库
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21'

    // FlatBuffers - DexKit 运行时依赖
    implementation 'com.google.flatbuffers:flatbuffers-java:25.2.10'
}
